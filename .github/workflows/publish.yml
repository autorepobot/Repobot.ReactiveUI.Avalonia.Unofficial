name: Publish unofficial ReactiveUI.Avalonia

on:
  workflow_dispatch:
    inputs:
      sourceVersion:
        description: "Official ReactiveUI.Avalonia version"
        required: true
        default: "11.4.12"
      packageVersion:
        description: "Unofficial package version"
        required: true
        default: "11.4.12"

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Download official package
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/ReactiveUI.Avalonia/${{ inputs.sourceVersion }}" -OutFile "official.nupkg"

      - name: Repack as unofficial package
        shell: pwsh
        run: |
          Expand-Archive -Path "official.nupkg" -DestinationPath "src"

          New-Item -Path "cleanpkg" -ItemType Directory -Force | Out-Null

          Copy-Item -Path "src/lib" -Destination "cleanpkg/lib" -Recurse
          Copy-Item -Path "src/LICENSE" -Destination "cleanpkg/LICENSE" -Recurse -ErrorAction SilentlyContinue
          Copy-Item -Path "src/logo.png" -Destination "cleanpkg/logo.png" -ErrorAction SilentlyContinue

          @"
          # Repobot.ReactiveUI.Avalonia.Unofficial

          ⚠️ This is an unofficial package.

          ## What is this?

          Repobot.ReactiveUI.Avalonia.Unofficial is a repackaged version of ReactiveUI.Avalonia ${{ inputs.sourceVersion }}.

          It exists to help maintain existing Avalonia 11.x projects when the original package cannot be restored because of NuGet package-signature validation issues.

          ## Changes from the official package

          - Package ID changed to `Repobot.ReactiveUI.Avalonia.Unofficial`
          - Package re-packed and re-published
          - Original dependency groups preserved
          - Original binaries preserved
          - No source code modifications intended
          - Not signed or published by the ReactiveUI maintainers

          ## Why does this package exist?

          Some historical ReactiveUI.Avalonia releases are currently affected by NuGet restore failures caused by package-signing certificate revocation checks.

          Projects that remain on Avalonia 11.x may not be able to migrate immediately to newer ReactiveUI.Avalonia releases.

          This package provides a temporary compatibility path for such projects.

          ## Disclaimer

          This package is:

          - NOT an official ReactiveUI package
          - NOT affiliated with the ReactiveUI project
          - NOT endorsed by ReactiveUI maintainers

          Please use official ReactiveUI.Avalonia releases whenever possible.

          ## Original project

          ReactiveUI.Avalonia:

          https://github.com/reactiveui/ReactiveUI.Avalonia

          ReactiveUI:

          https://github.com/reactiveui/ReactiveUI
          "@ | Out-File -FilePath "cleanpkg/README.md" -Encoding utf8

          $script = @'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          package_id = "Repobot.ReactiveUI.Avalonia.Unofficial"
          package_version = "__PACKAGE_VERSION__"
          source_version = "__SOURCE_VERSION__"

          nuspec = Path("src/ReactiveUI.Avalonia.nuspec")
          tree = ET.parse(nuspec)
          root = tree.getroot()

          ns = ""
          if root.tag.startswith("{"):
              ns = root.tag.split("}")[0] + "}"

          metadata = root.find(f"{ns}metadata")

          metadata.find(f"{ns}id").text = package_id
          metadata.find(f"{ns}version").text = package_version

          authors = metadata.find(f"{ns}authors")
          if authors is not None:
              authors.text = "Repobot"

          owners = metadata.find(f"{ns}owners")
          if owners is not None:
              owners.text = "Repobot"

          description = metadata.find(f"{ns}description")
          if description is not None:
              description.text = (
                  f"Unofficial repack of ReactiveUI.Avalonia {source_version}. "
                  f"Original dependency groups preserved. "
                  f"Original binaries preserved. "
                  f"Not affiliated with ReactiveUI."
              )

          title = metadata.find(f"{ns}title")
          if title is not None:
              title.text = package_id

          files = root.find(f"{ns}files")
          if files is not None:
              root.remove(files)

          files = ET.SubElement(root, f"{ns}files")

          def add_file(src, target):
              node = ET.SubElement(files, f"{ns}file")
              node.set("src", src)
              node.set("target", target)

          add_file("lib\\**\\*", "lib")
          add_file("LICENSE\\**\\*", "LICENSE")
          add_file("README.md", "")
          add_file("logo.png", "")

          tree.write(
              "cleanpkg/Repobot.ReactiveUI.Avalonia.Unofficial.nuspec",
              encoding="utf-8",
              xml_declaration=True
          )
          '@

          $script = $script.Replace("__PACKAGE_VERSION__", "${{ inputs.packageVersion }}")
          $script = $script.Replace("__SOURCE_VERSION__", "${{ inputs.sourceVersion }}")
          $script | Out-File -FilePath "patch_nuspec.py" -Encoding utf8

          python patch_nuspec.py

          nuget pack "cleanpkg/Repobot.ReactiveUI.Avalonia.Unofficial.nuspec" -BasePath "cleanpkg" -OutputDirectory "."

      - name: Show package info
        shell: pwsh
        run: |
          Get-ChildItem "*.nupkg"

      - name: Push to NuGet
        shell: pwsh
        run: |
          dotnet nuget push "Repobot.ReactiveUI.Avalonia.Unofficial.${{ inputs.packageVersion }}.nupkg" --source "https://api.nuget.org/v3/index.json" --api-key "${{ secrets.NUGET_API_KEY }}" --skip-duplicate
