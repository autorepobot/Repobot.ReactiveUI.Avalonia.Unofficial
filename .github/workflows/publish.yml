name: Publish unofficial ReactiveUI.Avalonia

on:
  workflow_dispatch:
    inputs:
      sourceVersion:
        description: "Official ReactiveUI.Avalonia version to repackage"
        required: true
        default: "11.4.12"
      packageVersion:
        description: "Unofficial package version to publish"
        required: true
        default: "11.4.12"

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Download official package
        run: |
          curl -L -o official.nupkg \
            "https://www.nuget.org/api/v2/package/ReactiveUI.Avalonia/${{ inputs.sourceVersion }}"

      - name: Repack as clean unofficial package
        shell: bash
        run: |
          set -e

          mkdir src cleanproj
          unzip -q official.nupkg -d src

          find src -name ".DS_Store" -delete

          mkdir -p cleanproj/lib
          cp -R src/lib/* cleanproj/lib/

          cp -R src/LICENSE cleanproj/ || true
          cp src/README.md cleanproj/ || true
          cp src/logo.png cleanproj/ || true

          cat > cleanproj/Repobot.ReactiveUI.Avalonia.Unofficial.csproj <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net8.0</TargetFramework>
              <PackageId>Repobot.ReactiveUI.Avalonia.Unofficial</PackageId>
              <Version>${{ inputs.packageVersion }}</Version>
              <Authors>ReactiveUI contributors; unofficial repack by Repobot</Authors>
              <Description>Unofficial repack of ReactiveUI.Avalonia ${{ inputs.sourceVersion }}. Package signature removed due to revoked author certificate. DLL/XML/content copied from the original package.</Description>
              <PackageLicenseExpression>MIT</PackageLicenseExpression>
              <PackageReadmeFile>README.md</PackageReadmeFile>
              <PackageIcon>logo.png</PackageIcon>
              <IncludeBuildOutput>false</IncludeBuildOutput>
              <NoDefaultExcludes>true</NoDefaultExcludes>
              <NoPackageAnalysis>true</NoPackageAnalysis>
            </PropertyGroup>

            <ItemGroup>
              <None Include="lib/**/*" Pack="true" PackagePath="lib/" />
              <None Include="LICENSE/**/*" Pack="true" PackagePath="LICENSE/" />
              <None Include="README.md" Pack="true" PackagePath="" />
              <None Include="logo.png" Pack="true" PackagePath="" />
            </ItemGroup>
          </Project>
          EOF

          dotnet pack cleanproj/Repobot.ReactiveUI.Avalonia.Unofficial.csproj \
            -c Release \
            -o .

      - name: Push to NuGet
        run: |
          dotnet nuget push \
            "Repobot.ReactiveUI.Avalonia.Unofficial.${{ inputs.packageVersion }}.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ secrets.NUGET_API_KEY }}" \
            --skip-duplicate
